name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: 🚀 Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

      - name: Change to next
        run: git checkout next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "Release ${{ steps.timestamp.outputs.value }}"
          title: "Release ${{ steps.timestamp.outputs.value }}"
          body: "Automated release PR"
          base: master
          branch: next
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Pull Request
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge --admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Master
        run: |
          git checkout master
          git pull
          git tag v-${{ steps.timestamp.outputs.value }}
          git push --tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}